<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dessert</title>
    <link rel="stylesheet" href="css/dessert.css" />
  </head>
  <body>
    <div id="dessertquestion">Which dessert we're eating babe</div>

    <div class="dessert-selection">
      <div class="dessert-item">
        <img src="food/boba.jpeg" alt="Boba" />
        <label
          ><input type="checkbox" name="dessert" value="Boba" /> Boba</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/churro.jpeg" alt="Churro" />
        <label
          ><input type="checkbox" name="dessert" value="Churro" /> Churro</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/che.jpeg" alt="Shakes" />
      <label><input type="checkbox" name="dessert" value="Shakes" /> Shakes</label>
      </div>
      <div class="dessert-item">
        <img src="food/rasgulla.jpeg" alt="Rasgulla" />
        <label
          ><input type="checkbox" name="dessert" value="Rasgulla" /> Rasgulla</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/randombun.jpeg" alt="Randombun" />
        <label
          ><input type="checkbox" name="dessert" value="Randombun" /> Random
          bun</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/icecream.jpeg" alt="Ice-cream" />
        <label
          ><input type="checkbox" name="dessert" value="Ice-cream" />
          Ice-cream</label
        >
      </div>
    </div>
    <button class="button" onclick="location.href='activities.html'">
      Continue NOW
    </button>
    <script src="music.js"></script>
  </body>
</html>
