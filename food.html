<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Selection</title>
    <link rel="stylesheet" href="css/food.css" />
  </head>
  <body>
    <div id="foodquestion">
      <b>What food would you like to eat?</b>
    </div>

    <div class="food-selection">
      <div class="food-item">
        <img src="food/burgers.jpeg" alt="Burgers, fries and fried chicken" />
        <label
          ><input
            type="checkbox"
            name="food"
            value="Burgers, fries and fried chicken"
          />
          Burgers and Fried Chicken</label
        >
      </div>
      <div class="food-item">
        <img src="food/panipuri.jpg" alt="panipuri" />
        <label
          ><input type="checkbox" name="food" value="panipuri" /> Pani Puri</label>
      </div>
      <div class="food-item">
        <img src="food/koreanfood.jpeg" alt="koreanfood" />
        <label
          ><input type="checkbox" name="food" value="Korean food" /> Korean food</label>
      </div>
      <div class="food-item">
        <img src="food/pasta.jpeg" alt="pasta" />
        <label><input type="checkbox" name="food" value="pasta" /> Pasta</label>
      </div>
      <div class="food-item">
        <img src="food/pizza.jpeg" alt="pizza" />
        <label><input type="checkbox" name="food" value="pizza" /> Pizza</label>
      </div>
      <div class="food-item">
        <img src="food/salad.jpeg" alt="salad" />
        <label><input type="checkbox" name="food" value="salad" /> Salad</label>
      </div>
      <div class="food-item">
        <img src="food/momos.jpg" alt="momos" />
        <label><input type="checkbox" name="food" value="momos" /> Momos</label>
      </div>
      <div class="food-item">
        <img src="food/southindian.jpg" alt="southindian" />
        <label><input type="checkbox" name="food" value="southindian" /> South Indian</label>
      </div>
    </div>
    <button class="button" onclick="location.href='dessert.html'">
      Continue NOW
    </button>
    <script src="music.js"></script>
  </body>
</html>
